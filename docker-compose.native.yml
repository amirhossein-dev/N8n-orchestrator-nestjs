services:
  postgres-native:
    image: postgres:15-alpine
    container_name: dara_native_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "127.0.0.1:${DB_PORT}:5432"

    volumes:
      - dara_native_pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  dara_native_pgdata:
